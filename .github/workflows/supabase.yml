name: Keep Supabase Alive

on:
  schedule:
    # Run every 5 days at 00:00 UTC to prevent Supabase free-tier inactivity pause
    - cron: '0 0 */5 * *'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "Error: Supabase secrets are not set in GitHub repository settings."
            echo "Go to Settings -> Secrets and variables -> Actions and add:"
            echo "  - NEXT_PUBLIC_SUPABASE_URL"
            echo "  - NEXT_PUBLIC_SUPABASE_ANON_KEY"
            exit 1
          fi

          echo "Pinging Supabase database to keep project active..."

          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            "${SUPABASE_URL%/}/rest/v1/certificates?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY")

          if [ "$RESPONSE" -eq 200 ]; then
            echo "Successfully pinged Supabase! (HTTP $RESPONSE)"
          else
            echo "Failed to ping Supabase. HTTP Status: $RESPONSE"
            exit 1
          fi
